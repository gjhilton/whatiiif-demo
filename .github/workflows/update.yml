# Opens a pull request when a newer version of the template is released.
# Needs Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
name: Update

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: engine/ci/update.sh
        env:
          GH_TOKEN: ${{ github.token }}
