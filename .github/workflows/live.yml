# whatiiif: template only.
# Keeps everything outside this repository in step with it, and checks it on real GitHub, after each change, each
# release, and every day (GitHub itself changes too):
# - demo: pushes the template to each demo repository, named by the DEMO_REPOSITORY variable (the plain demo) and
#   NOTES_DEMO_REPOSITORY (the one with notes and a tour), whose own Deploy workflows publish it to GitHub Pages, then
#   checks the live sites. Each is pushed to with a deploy key for it alone.
# - screenshots: once both demos are up, remakes the README's screenshots of them on a Mac and commits any that look
#   different to main.
# - trial: makes repositories from the template as a newcomer would and tries it in them (engine/test/live), with
#   the LIVE_TRIAL_TOKEN secret, a token that may create and delete repositories.
# Copies of the template have no DEMO_REPOSITORY, so this does nothing there.
name: Live

on:
  push:
    branches: [main]
    paths: ['engine/**', 'package*.json', '.github/workflows/deploy.yml', '.github/workflows/publish.yml', '.github/workflows/live.yml']
  release:
    types: [published]
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live

jobs:
  demo:
    if: vars.DEMO_REPOSITORY != ''
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        demo:
          - { repository: DEMO_REPOSITORY, key: DEMO_DEPLOY_KEY }
          - { repository: NOTES_DEMO_REPOSITORY, key: NOTES_DEMO_DEPLOY_KEY }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: engine/.node-version
          cache: npm
      - name: Publish this commit through the demo's own Deploy workflow
        if: vars[matrix.demo.repository] != ''
        id: demo
        shell: bash # with pipefail, so a failure is not hidden by tee
        run: |
          mkdir -p ~/.ssh
          gh api meta --jq '.ssh_keys[] | "github.com " + .' >> ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          ssh-add - <<< "$DEMO_DEPLOY_KEY"
          engine/test/live/deploy-demo.sh "$DEMO_REPOSITORY" | tee demo.log
          echo "url=$(tail -1 demo.log)" >> "$GITHUB_OUTPUT"
        env:
          DEMO_REPOSITORY: ${{ vars[matrix.demo.repository] }}
          DEMO_DEPLOY_KEY: ${{ secrets[matrix.demo.key] }}
          GH_TOKEN: ${{ github.token }}
      - name: Check the live site
        if: steps.demo.outcome == 'success'
        run: |
          npm ci
          npx playwright install --with-deps chromium-headless-shell
          node --test engine/test/e2e/check-site.js
        env:
          E2E_SITE_URL: ${{ steps.demo.outputs.url }}

  screenshots:
    needs: demo
    if: vars.DEMO_REPOSITORY != ''
    runs-on: macos-15 # the README's screenshots are a Mac's, as most people reading it will see the page
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: engine/.node-version
          cache: npm
      - name: Remake the README's screenshots of the demos
        run: |
          npm ci
          npx playwright install chromium-headless-shell
          node engine/test/support/readme-screenshots.js
      - name: Commit any that look different
        run: |
          git add engine/artwork
          if git diff --cached --quiet; then
            echo "The README's screenshots are up to date."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "README screenshots, remade from the demos at ${GITHUB_SHA::7}"
          # main may have moved on while this ran; the screenshots are the only change, so they go on top of it.
          for attempt in 1 2 3; do
            git fetch -q origin main && git rebase -q origin/main && git push -q origin HEAD:main && exit 0
            sleep 10
          done
          echo "::error title=The README's screenshots were not committed::main kept moving; run Live again."
          exit 1

  trial:
    if: vars.DEMO_REPOSITORY != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the update trial starts a repository on the previous release, by its tag
      - uses: actions/setup-node@v7
        with:
          node-version-file: engine/.node-version
          cache: npm
      - name: Try the template in repositories made from it, as a newcomer would, then delete them
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error title=No LIVE_TRIAL_TOKEN::Add a classic personal access token with the repo, workflow and delete_repo scopes as the LIVE_TRIAL_TOKEN secret: the trials make repositories and delete them."
            exit 1
          fi
          npm ci
          npx playwright install --with-deps chromium-headless-shell
          npm run test:live
        env:
          GH_TOKEN: ${{ secrets.LIVE_TRIAL_TOKEN }}
